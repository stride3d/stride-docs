name: 'Setup Stride'
description: 'Sets up .NET, checkouts repos, and installs DocFX'

inputs:
  github-token:
    description: 'GitHub token used for repository checkout'
    required: true
  skip-pdf-building:
    description: 'Skip PDF building when set to true'
    required: false
    default: 'false'
  skip-api-building:
    description: 'Skip API building when set to true'
    required: false
    default: 'false'
  stride-branch:
    description: 'Stride branch to checkout (default: master-x.y for a master-x.y branch of stride-docs, master otherwise)'
    required: false
    default: ''

runs:
  using: "composite"

  steps:
  - name: .NET SDK Setup
    uses: actions/setup-dotnet@v5
    with:
      dotnet-version: 10.x

  # - name: Configure MSBuild SDK resolver - Temporary
  #   run: |
  #     $dotnetRoot = Split-Path (Get-Command dotnet).Source -Parent
  #     $sdkVersion = & dotnet --version
  #     $msbuildSdksPath = Join-Path $dotnetRoot "sdk\$sdkVersion\Sdks"

  #     echo "DOTNET_ROOT=$dotnetRoot" >> $env:GITHUB_ENV
  #     echo "MSBuildSDKsPath=$msbuildSdksPath" >> $env:GITHUB_ENV
  #     echo "MSBuildEnableWorkloadResolver=false" >> $env:GITHUB_ENV

  #     Write-Host "DOTNET_ROOT=$dotnetRoot"
  #     Write-Host "MSBuildSDKsPath=$msbuildSdksPath"
  #     Write-Host "MSBuildEnableWorkloadResolver=false"

  #     if (-not (Test-Path $msbuildSdksPath)) {
  #       throw "MSBuildSDKsPath does not exist: $msbuildSdksPath"
  #     }
  #   shell: pwsh

  # The documentation of a version (master-4.3, or e.g. master-4.3-fix) documents the API of the matching branch of Stride
  - name: Select Stride branch
    id: stride-branch
    shell: bash
    env:
      STRIDE_BRANCH: ${{ inputs.stride-branch }}
    run: |
      branch="$STRIDE_BRANCH"
      if [ -z "$branch" ]; then
        docs_branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
        if [[ "$docs_branch" =~ ^master-[0-9]+\.[0-9]+ ]]; then branch="${BASH_REMATCH[0]}"; else branch=master; fi
      fi
      echo "Stride branch: $branch"
      echo "branch=$branch" >> "$GITHUB_OUTPUT"

  - name: Checkout Stride (note the LFS)
    uses: actions/checkout@v6
    with:
      repository: stride3d/stride
      token: ${{ inputs.github-token }}
      path: stride
      lfs: true
      ref: ${{ steps.stride-branch.outputs.branch }}

  # - name: Install MSVC ARM64/ARM64EC build tools - Temporary
  #   run: |
  #     $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
  #     $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

  #     $installPath = & $vswhere -latest -products * -property installationPath

  #     if (-not $installPath) {
  #       throw "Visual Studio installation not found."
  #     }

  #     Write-Host "Visual Studio install path: $installPath"

  #     Start-Process -FilePath $installer -ArgumentList @(
  #       "modify",
  #       "--installPath", $installPath,
  #       "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
  #       "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64EC",
  #       "--quiet",
  #       "--norestart",
  #       "--nocache",
  #       "--wait"
  #     ) -Wait -NoNewWindow
  #   shell: pwsh

  # A specific, tested version of DocFX: an update can change the generated pages
  # (i.e. the 404 page relies on internals of the modern template, see Upgrading Docfx in docfx.md)
  - name: Install DocFX
    run: dotnet tool update -g docfx --version 2.81.0
    shell: pwsh

  # - name: Prebuild Stride
  #   run: dotnet build build\Stride.sln -c Release
  #   working-directory: stride
  #   shell: pwsh

  - name: Build documentation
    run: |
      $arguments = @()

      if ('${{ inputs.skip-pdf-building }}' -eq 'true') {
        $arguments += '-SkipPdfBuilding'
      }

      if ('${{ inputs.skip-api-building }}' -eq 'true') {
        $arguments += '-SkipApiBuilding'
      }

      ./build-all.bat @arguments
    working-directory: ${{ env.DOCS_PATH }}
    shell: pwsh
