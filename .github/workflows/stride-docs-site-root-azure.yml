# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

# Deploys the files shared by all documentation versions at the root of the site: versions.json, web.config and robots.txt.
# They are generated by BuildSiteRoot.ps1 from master, so that deploying any version never overwrites them.
# Making a version the latest one is only a change of versions.json followed by this workflow, no rebuild needed.
name: Deploy Stride Docs site root to Azure Web App 🚀

on:
  push:
    branches:
      - master
    paths:
      - 'versions.json'
      - 'web.config'
      - 'robots.txt'
      - 'BuildSiteRoot.ps1'
  workflow_dispatch:
    inputs:
      slot:
        description: Azure slot to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  # Pushes to master are deployed to staging only
  SLOT: ${{ inputs.slot || 'staging' }}

concurrency:
  group: azure-${{ inputs.slot || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Run this job only if the repository is 'stride3d/stride-docs'
    if: github.repository == 'stride3d/stride-docs'
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.slot == 'production' && 'Production' || 'Staging' }}

    steps:
    - name: Check branch
      if: env.SLOT == 'production' && github.ref != 'refs/heads/master'
      run: |
        echo "::error::The site root is shared by all versions, it can only be deployed to production from master."
        exit 1

    - name: Checkout Stride Docs
      uses: actions/checkout@v6

    - name: Generate site root files
      run: ./BuildSiteRoot.ps1 -OutputDirectory site-root
      shell: pwsh

    # Each file is deployed on its own, so that nothing else in the site is removed
    - name: Deploy web.config
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ env.SLOT == 'production' && 'Production' || 'staging' }}
        # Secret of the environment (Production or Staging), for its slot
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: site-root/web.config
        type: static
        target-path: /home/site/wwwroot/web.config
        clean: false
        restart: false

    - name: Deploy versions.json
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ env.SLOT == 'production' && 'Production' || 'staging' }}
        # Secret of the environment (Production or Staging), for its slot
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: site-root/versions.json
        type: static
        target-path: /home/site/wwwroot/versions.json
        clean: false
        restart: false

    - name: Deploy robots.txt
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ env.SLOT == 'production' && 'Production' || 'staging' }}
        # Secret of the environment (Production or Staging), for its slot
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: site-root/robots.txt
        type: static
        target-path: /home/site/wwwroot/robots.txt
        clean: false
        restart: false
