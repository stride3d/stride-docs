# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

# Builds the documentation of the branch it runs from (master, master-4.3, ...) and deploys it into its own version folder (i.e. 4.4/),
# and from master the unversioned sections (en/) and the files at the root of the site (versions.json, web.config, robots.txt),
# or only one of them (sections input). Other versions are left untouched.
# The root files are generated by BuildSiteRoot.ps1 from master, so that deploying an older version never changes them:
# making a version the latest one is only a change of versions.json followed by a deploy of the root, no rebuild needed.
name: Deploy Stride Docs to Azure Web App 🚀

env:
  # Tag of the GitHub release created for production deployments
  VERSION: "2.0.0.${{ github.run_number }}"
  DOCS_PATH: stride-docs
  SLOT: ${{ inputs.slot }}
  # The unversioned sections and the site root are only deployed from master, where they're maintained: all deploys only the version elsewhere
  SECTIONS: ${{ github.ref_name != 'master' && inputs.sections == 'all' && 'versioned' || inputs.sections }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Azure slot to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      sections:
        # The Run workflow dialog shows the description on one line, without Markdown
        description: 'all: everything on master, the version only elsewhere. versioned: the version folder. unversioned: en/ (master only). root: versions.json, web.config, robots.txt (master only)'
        required: true
        default: all
        type: choice
        options:
          - all
          - unversioned
          - versioned
          - root
      skipPdfBuilding:
        description: Skip PDF building (staging only, production always builds it)
        required: true
        default: true
        type: boolean
      skipApiBuilding:
        description: Skip API building (staging only, production always builds it)
        required: true
        default: false
        type: boolean
      strideBranch:
        description: 'Stride branch to checkout (default: master-x.y for a master-x.y branch of stride-docs, master otherwise)'
        required: false
        default: ''
        type: string

permissions:
  contents: write  # required to create releases/tags
  id-token: write  # required to sign in to Azure (purge of the Azure Front Door cache)

# A newer run of the same branch and sections to the same slot replaces the older one, also while it waits for approval.
# The sections are those of env.SECTIONS (env isn't available here): all and versioned are the same run outside master
concurrency:
  group: deploy-azure-${{ github.ref_name }}-${{ inputs.slot }}-${{ github.ref_name != 'master' && inputs.sections == 'all' && 'versioned' || inputs.sections }}
  cancel-in-progress: true

jobs:
  deploy:
    # Run this job only if the repository is 'stride3d/stride-docs'
    if: github.repository == 'stride3d/stride-docs'
    # One deploy at a time on a slot: the search indexes merge what's deployed there.
    # The others wait in line, instead of the default where a new one cancels the one already waiting
    concurrency:
      group: azure-${{ inputs.slot }}
      cancel-in-progress: false
      queue: max
    # One job, so that all needs a single approval and deploys the root right after the documentation, on the same lock.
    # The root alone builds nothing: about a minute on Linux
    runs-on: ${{ inputs.sections == 'root' && 'ubuntu-latest' || 'windows-2025-vs2026' }}

    environment:
      # Staging-branch requires an approval: any branch can deploy to staging through it, Staging only allows master and master-*
      name: ${{ inputs.slot == 'production' && 'Production' || (github.ref_name == 'master' || startsWith(github.ref_name, 'master-')) && 'Staging' || 'Staging-branch' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url || steps.deploy-unversioned.outputs.webapp-url || steps.deploy-root.outputs.webapp-url }}

    env:
      # The Azure Web App itself, not the CDN of doc.stride3d.net: the search indexes are merged with what it serves,
      # and the deploy is checked there
      SITE_URL: https://stride-doc${{ inputs.slot != 'production' && '-staging' || '' }}.azurewebsites.net

    steps:
    - name: Check sections
      if: (inputs.sections == 'unversioned' || inputs.sections == 'root') && github.ref_name != 'master'
      shell: bash
      run: |
        echo "::error::The unversioned sections and the site root are maintained on master, they can only be deployed from master."
        exit 1

    # The deploy replaces the whole version folder: without the API, it would be removed from the site
    # Checkout the Stride Docs repository from the branch the workflow runs from
    - name: Checkout Stride Docs
      uses: actions/checkout@v6
      with:
        path: ${{ env.DOCS_PATH }}
        lfs: ${{ env.SECTIONS != 'root' }}

    # Also for the unversioned sections: the upgrade guide is checked against the upgrade steps of Stride,
    # and the engine architecture pages of the contributors section come from its docs/ folder
    - name: Run Global Setup
      if: env.SECTIONS != 'root'
      id: setup
      uses: ./stride-docs/.github/actions/setup-stride
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # A deploy replaces the whole version folder: production always gets everything
        skip-pdf-building: ${{ inputs.slot != 'production' && inputs.skipPdfBuilding }}
        skip-api-building: ${{ inputs.slot != 'production' && inputs.skipApiBuilding }}
        stride-branch: ${{ inputs.strideBranch }}
        sections: ${{ env.SECTIONS }}
        search-index-site: ${{ env.SITE_URL }}

    # _site contains the folders that were built (with a build.json), the search index alone of folders that weren't
    # (see Merge-SearchIndex of BuildDocs.ps1), and site root files for the production slot, which the root steps generate again
    - name: Find what to deploy
      if: env.SECTIONS != 'root'
      id: content
      run: |
        $site = "${{ env.DOCS_PATH }}/_site"
        $versions = @()
        $unversioned = $false
        $indexes = @()
        foreach ($folder in Get-ChildItem -Directory $site) {
          if (Test-Path "$($folder.FullName)/build.json") {
            if ($folder.Name -eq 'en') { $unversioned = $true } else { $versions += $folder.Name }
            continue
          }
          $index = if ($folder.Name -eq 'en') { 'en/index.json' } else { "$($folder.Name)/en/index.json" }
          if (Test-Path "$site/$index") { $indexes += $index }
        }
        if ($env:SECTIONS -ne 'unversioned' -and $versions.Count -ne 1) {
          throw "Expected a single version folder in _site, found: $($versions -join ', ')"
        }
        if ($env:SECTIONS -ne 'versioned' -and -not $unversioned) {
          throw "The unversioned sections weren't built into _site/en"
        }

        $summary = @($versions | ForEach-Object { "$_/" }) + @(if ($unversioned) { 'en/' }) + @($indexes | ForEach-Object { "search index $_" }) +
          @(if ($env:SECTIONS -eq 'all') { 'site root' })
        Write-Host "Deploying: $($summary -join ', ')"
        "version=$($versions -join '')" >> $env:GITHUB_OUTPUT
        "unversioned=$($unversioned.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        "indexes=$($indexes -join ' ')" >> $env:GITHUB_OUTPUT
        "summary=$($summary -join ', ')" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # webapps-deploy only zips a folder itself when no type is given
    - name: Package documentation version
      if: steps.content.outputs.version != ''
      run: 7z a -tzip -mx=1 -bso0 -bsp0 "${{ runner.temp }}/docs.zip" "./${{ env.DOCS_PATH }}/_site/${{ steps.content.outputs.version }}/*"
      shell: pwsh

    - name: Deploy to Azure Web App
      if: steps.content.outputs.version != ''
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ env.SLOT == 'production' && 'Production' || 'staging' }}
        # Secret of the environment (Production or Staging), for its slot
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: ${{ runner.temp }}/docs.zip
        type: zip
        # Only this version folder is replaced, files removed from the documentation are deleted from it
        target-path: /home/site/wwwroot/${{ steps.content.outputs.version }}
        clean: true
        restart: false

    - name: Package unversioned sections
      if: steps.content.outputs.unversioned == 'true'
      run: 7z a -tzip -mx=1 -bso0 -bsp0 "${{ runner.temp }}/unversioned.zip" "./${{ env.DOCS_PATH }}/_site/en/*"
      shell: pwsh

    - name: Deploy unversioned sections to Azure Web App
      if: steps.content.outputs.unversioned == 'true'
      id: deploy-unversioned
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ env.SLOT == 'production' && 'Production' || 'staging' }}
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: ${{ runner.temp }}/unversioned.zip
        type: zip
        target-path: /home/site/wwwroot/en
        clean: true
        restart: false

    # The search index of a folder that wasn't built, i.e. en/index.json when only the latest version is deployed
    - name: Package search indexes
      if: steps.content.outputs.indexes != ''
      working-directory: ${{ env.DOCS_PATH }}/_site
      run: 7z a -tzip -mx=1 -bso0 -bsp0 "${{ runner.temp }}/indexes.zip" ${{ steps.content.outputs.indexes }}
      shell: pwsh

    # Incremental deploy (clean: false): only these files are replaced, the rest of their folders is left untouched
    - name: Deploy search indexes to Azure Web App
      if: steps.content.outputs.indexes != ''
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ env.SLOT == 'production' && 'Production' || 'staging' }}
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: ${{ runner.temp }}/indexes.zip
        type: zip
        target-path: /home/site/wwwroot
        clean: false
        restart: false

    # On the Azure Web App itself: build.json of each folder deployed must be the one just built, and each search index deployed
    # alone the one just merged
    - name: Check the deployed files
      if: env.SECTIONS != 'root'
      shell: bash
      run: |
        # The deployed files can take a few seconds to show up
        retry() {
          for attempt in 1 2 3 4 5 6; do
            "$@" && return 0
            sleep 10
          done
          return 1
        }
        commit_of() { curl -sf "$SITE_URL/$1/build.json" | jq -r .docs.commit; }
        has_commit() { [ "$(commit_of "$1")" = "$GITHUB_SHA" ]; }
        same_index() { curl -sf "$SITE_URL/$1" | cmp -s - "$DOCS_PATH/_site/$1"; }

        failed=0
        folders="${{ steps.content.outputs.version }}"
        if [ "${{ steps.content.outputs.unversioned }}" = "true" ]; then folders="$folders en"; fi
        for folder in $folders; do
          if retry has_commit "$folder"; then
            echo "$SITE_URL/$folder/build.json: $GITHUB_SHA"
          else
            echo "::error::$SITE_URL/$folder/build.json doesn't have the commit $GITHUB_SHA (found: $(commit_of "$folder"))"
            failed=1
          fi
        done
        for index in ${{ steps.content.outputs.indexes }}; do
          if retry same_index "$index"; then
            echo "$SITE_URL/$index: the merged search index"
          else
            echo "::error::$SITE_URL/$index isn't the search index just merged"
            failed=1
          fi
        done
        exit $failed

    # The root last, so that its redirects only point at pages once they're deployed
    - name: Generate site root files
      if: env.SECTIONS == 'root' || env.SECTIONS == 'all'
      run: ./${{ env.DOCS_PATH }}/BuildSiteRoot.ps1 -OutputDirectory site-root -Slot $env:SLOT
      shell: pwsh

    - name: Package site root files
      if: env.SECTIONS == 'root' || env.SECTIONS == 'all'
      run: Compress-Archive -Path site-root/* -DestinationPath site-root.zip
      shell: pwsh

    # Incremental deploy (clean: false): only these files are replaced, the folders are left untouched
    - name: Deploy site root files to Azure Web App
      if: env.SECTIONS == 'root' || env.SECTIONS == 'all'
      id: deploy-root
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ env.SLOT == 'production' && 'Production' || 'staging' }}
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: site-root.zip
        type: zip
        target-path: /home/site/wwwroot
        clean: false
        restart: false

    - name: Check the deployed site root
      if: env.SECTIONS == 'root' || env.SECTIONS == 'all'
      shell: bash
      run: |
        # On the Windows runner, curl and jq end their lines with \r\n: tr -d '\r' removes it from the outputs read line by line
        latest=$(jq -r .latest site-root/versions.json)
        failed=0
        # url, expected status, expected end of the redirection location (optional)
        check() {
          read -r status location < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$SITE_URL$1" | tr -d '\r')
          if [ "$status" != "$2" ] || [[ -n "$3" && "$location" != *"$3" ]]; then
            echo "::error::$1 -> $status $location (expected $2 $3)"
            failed=1
          else
            echo "$1 -> $status $location"
          fi
        }
        curl -sf "$SITE_URL/versions.json" | cmp -s - site-root/versions.json || { echo "::error::The deployed versions.json differs from site-root/versions.json"; failed=1; }
        # How long browsers keep the files (%client_cache_mode% of web.config)
        expected_cache="${{ env.SLOT == 'production' && 'max-age=3600' || 'no-cache' }}"
        cache=$(curl -sI "$SITE_URL/versions.json" | tr -d '\r' | sed -n 's/^[Cc]ache-[Cc]ontrol: *//p')
        if [ "$cache" != "$expected_cache" ]; then
          echo "::error::/versions.json -> Cache-Control: $cache (expected $expected_cache)"
          failed=1
        else
          echo "/versions.json -> Cache-Control: $cache"
        fi
        check / 302 /latest/en/
        check /latest/en/index.html 200
        # Unversioned sections, redirected to /en/ from every version (with the version as ?v=)
        for section in $(jq -r '.unversioned[]' site-root/versions.json | tr -d '\r'); do
          check /$latest/en/$section/toc.json 302 "/en/$section/toc.json?v=$latest"
        done
        check /latest/en/contributors/index.html 302 /en/contributors/index.html
        check /$latest/en/release-notes/index.html 302 "/en/release-notes/$latest.html?v=$latest"
        # Release notes links of the docs of 4.3 and older
        check /$latest/en/ReleaseNotes/ReleaseNotes.html 302 "/en/release-notes/$latest.html?v=$latest"
        check /latest/en/ReleaseNotes/ReleaseNotes.html 302 "/en/release-notes/$latest.html"
        check /$latest/en/ReleaseNotes/toc.json 302 "/en/release-notes/toc.json?v=$latest"
        # Release notes markdown loaded by the Stride Launcher 5.x and older
        check /$latest/ReleaseNotes/ReleaseNotes.md 302 /en/release-notes/$latest.md
        check /en/ 302 /latest/en/
        check /missing-page.html 404
        # The 404 page of the unversioned area is its own (<location path="en"> of web.config)
        check /en/contributors/missing-page.html 404
        curl -s "$SITE_URL/en/contributors/missing-page.html" | grep -q '"/en/public/' || { echo "::error::/en/ doesn't serve its own 404 page"; failed=1; }
        exit $failed

    - name: Create GitHub Release
      if: env.SLOT == 'production' && env.SECTIONS != 'root'
      run: |
        gh release create ${{ env.VERSION }} --title "v${{ env.VERSION }}" --notes "Documentation deployed from ${{ github.ref_name }}: ${{ steps.content.outputs.summary }}" --draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: ${{ env.DOCS_PATH }}

    # Azure Front Door caches doc.stride3d.net: without a purge, it serves the old pages and redirects until they expire
    - name: Sign in to Azure
      if: env.SLOT == 'production'
      uses: azure/login@v2
      with:
        # Variables of the Production environment: the stride-frontdoor-purge managed identity, see deployment-azure.md
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Purge the Azure Front Door cache
      if: env.SLOT == 'production'
      shell: bash
      env:
        # Git Bash would turn /4.4/* into a Windows path
        MSYS_NO_PATHCONV: 1
      run: |
        version="${{ steps.content.outputs.version }}"
        paths=()
        if [ "$SECTIONS" = "root" ] || [ "$SECTIONS" = "all" ]; then
          # Everything: web.config changes the redirects of every version and what /latest/ serves
          paths+=("/*")
        else
          # /latest/ is a rewrite of web.config: Front Door caches its pages apart from the ones of the version folder
          latest=$(curl -sf "$SITE_URL/versions.json" | jq -r .latest)
          if [ -n "$version" ]; then
            paths+=("/$version/*")
            if [ "$latest" = "$version" ]; then paths+=("/latest/*"); fi
          fi
          if [ "${{ steps.content.outputs.unversioned }}" = "true" ]; then paths+=("/en/*"); fi
          for index in ${{ steps.content.outputs.indexes }}; do
            paths+=("/$index")
            if [ "$index" = "$latest/en/index.json" ]; then paths+=("/latest/en/index.json"); fi
          done
        fi
        echo "Purging ${paths[*]}"
        # Front Door takes a few minutes to apply it, no need to wait
        az afd endpoint purge -g Stride3d --profile-name stride-frontdoor --endpoint-name stride-doc --content-paths "${paths[@]}" --no-wait
