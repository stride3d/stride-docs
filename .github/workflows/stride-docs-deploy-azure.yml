# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

# Builds the documentation of the branch it runs from (master, master-4.3, ...) and deploys it into its own version folder (i.e. 4.4/).
# Other versions and the files at the root of the site (versions.json, web.config, robots.txt) are left untouched,
# the root files are deployed from master by stride-docs-site-root-azure.yml.
name: Deploy Stride Docs version to Azure Web App 🚀

env:
  # Tag of the GitHub release created for production deployments
  VERSION: "2.0.0.${{ github.run_number }}"
  DOCS_PATH: stride-docs

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Azure slot to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      skipPdfBuilding:
        description: Skip PDF building (staging only, production always builds it)
        required: true
        default: true
        type: boolean
      skipApiBuilding:
        description: Skip API building (staging only, production always builds it)
        required: true
        default: false
        type: boolean
      strideBranch:
        description: 'Stride branch to checkout (default: master-x.y for a master-x.y branch of stride-docs, master otherwise)'
        required: false
        default: ''
        type: string

permissions:
  contents: write  # required to create releases/tags

concurrency:
  group: azure-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  build-deploy:
    # Run this job only if the repository is 'stride3d/stride-docs'
    if: github.repository == 'stride3d/stride-docs'
    runs-on: windows-2025-vs2026

    environment:
      name: ${{ inputs.slot == 'production' && 'Production' || 'Staging' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    # The deploy replaces the whole version folder: without the API, it would be removed from the site
    # Checkout the Stride Docs repository from the branch the workflow runs from
    - name: Checkout Stride Docs
      uses: actions/checkout@v6
      with:
        path: ${{ env.DOCS_PATH }}
        lfs: true

    - name: Run Global Setup
      id: setup
      uses: ./stride-docs/.github/actions/setup-stride
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # A deploy replaces the whole version folder: production always gets everything
        skip-pdf-building: ${{ inputs.slot != 'production' && inputs.skipPdfBuilding }}
        skip-api-building: ${{ inputs.slot != 'production' && inputs.skipApiBuilding }}
        stride-branch: ${{ inputs.strideBranch }}

    # _site contains the folder of the version that was built, the unversioned sections (en/, see versions.json),
    # and the site root files which aren't deployed from here
    - name: Find documentation version
      id: version
      run: |
        $folders = @(Get-ChildItem -Directory "${{ env.DOCS_PATH }}/_site" | Where-Object { $_.Name -match '^\d+\.\d+$' })
        if ($folders.Count -ne 1) {
          throw "Expected a single version folder in _site, found: $($folders.Name -join ', ')"
        }
        Write-Host "Documentation version: $($folders[0].Name)"
        "version=$($folders[0].Name)" >> $env:GITHUB_OUTPUT
        # The unversioned sections are only deployed from master, where they're maintained
        $unversioned = (Test-Path "${{ env.DOCS_PATH }}/_site/en") -and ("${{ github.ref_name }}" -eq "master")
        Write-Host "Unversioned sections deployed: $unversioned"
        "unversioned=$($unversioned.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # webapps-deploy only zips a folder itself when no type is given
    - name: Package documentation version
      run: 7z a -tzip -mx=1 -bso0 -bsp0 "${{ runner.temp }}/docs.zip" "./${{ env.DOCS_PATH }}/_site/${{ steps.version.outputs.version }}/*"
      shell: pwsh

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ inputs.slot == 'production' && 'Production' || 'staging' }}
        # Secret of the environment (Production or Staging), for its slot
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: ${{ runner.temp }}/docs.zip
        type: zip
        # Only this version folder is replaced, files removed from the documentation are deleted from it
        target-path: /home/site/wwwroot/${{ steps.version.outputs.version }}
        clean: true
        restart: false

    - name: Package unversioned sections
      if: steps.version.outputs.unversioned == 'true'
      run: 7z a -tzip -mx=1 -bso0 -bsp0 "${{ runner.temp }}/unversioned.zip" "./${{ env.DOCS_PATH }}/_site/en/*"
      shell: pwsh

    - name: Deploy unversioned sections to Azure Web App
      if: steps.version.outputs.unversioned == 'true'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'stride-doc'
        slot-name: ${{ inputs.slot == 'production' && 'Production' || 'staging' }}
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: ${{ runner.temp }}/unversioned.zip
        type: zip
        target-path: /home/site/wwwroot/en
        clean: true
        restart: false

    # From the Azure Web App itself (not through the CDN of doc.stride3d.net): build.json of what was deployed must be the one just built
    - name: Check the deployed version
      shell: bash
      run: |
        base="https://stride-doc${{ inputs.slot != 'production' && '-staging' || '' }}.azurewebsites.net"
        folders="${{ steps.version.outputs.version }}"
        if [ "${{ steps.version.outputs.unversioned }}" = "true" ]; then folders="$folders en"; fi
        for folder in $folders; do
          url="$base/$folder/build.json"
          for attempt in 1 2 3 4 5 6; do
            commit=$(curl -sf "$url" | jq -r .docs.commit)
            [ "$commit" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::$url doesn't have the commit $GITHUB_SHA (found: $commit)"
            exit 1
          fi
          echo "$url: $commit"
        done

    - name: Create GitHub Release
      if: inputs.slot == 'production'
      run: |
        gh release create ${{ env.VERSION }} --title "v${{ env.VERSION }}" --notes "Documentation ${{ steps.version.outputs.version }} deployed from ${{ github.ref_name }}" --draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: ${{ env.DOCS_PATH }}
